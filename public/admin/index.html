<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <!--
      Sveltia CMS is a single-page app served from a CDN. Do NOT add a
      stylesheet <link> here, and do NOT add type="module" to this script —
      both are common mistakes that break it (the styles are bundled in the JS).

      This file must stay a static HTML file in public/. Do not move it to
      src/pages/admin.astro: Astro's dev live-reload would then reload the CMS
      on every content change.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
